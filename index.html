<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mood Tracker</title>
</head>
  <body>
   <div class="container">
    <h1>My Mood Tracker</h1>

    <div class="moods">
        <button onclick="setMood('😊 Happy')">😊</button>
        <button onclick="setMood('😤 Stressed')">😤</button>
        <button onclick="setMood('😒 Irritated')">😒</button>
        <button onclick="setMood('😢 Sad')">😢</button>
        <button onclick="setMood('😡 Angry')">😡</button>
        <button onclick="clearHistory()">Clear All</button>
    </div>

    <div id="result"></div>
    <div id="quote"></div>
     
    <h3>History</h3>
    <ul id="history"></ul>
 
    </div>
</body>
</html>
